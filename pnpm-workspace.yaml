packages:
  - .
overrides:
  "@next/env": "npm:@varlock/nextjs-integration"
  "dotenv": "npm:varlock"
# eslint-config-next still pulls these plugins, whose peer ranges stop at
# ESLint 9. Their rules were verified to run correctly on ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  msw: false
  sharp: false
  unrs-resolver: false
